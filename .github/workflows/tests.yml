# Runs the plug-in tests (against the bundled reader on each platform) and the
# companion app tests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install lupa segno

      - run: python tests/run_tests.py

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: node --test tests/companion.test.js
